name: Trigger AirMate Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-repair.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repair workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run repair-icloud-icon-battery.yml --repo "${{ github.repository }}" --ref main
