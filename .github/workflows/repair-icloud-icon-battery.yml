name: Repair AirMate iCloud Icon Battery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Repair project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          # 1) Keep project version/build consistent everywhere.
          p = Path('AirMate.xcodeproj/project.pbxproj')
          text = p.read_text()
          text = re.sub(r'MARKETING_VERSION=[^;]+;', 'MARKETING_VERSION=26.15;', text)
          text = re.sub(r'CURRENT_PROJECT_VERSION=[^;]+;', 'CURRENT_PROJECT_VERSION=10;', text)
          # Product names shown to users.
          text = text.replace('PRODUCT_NAME="$(TARGET_NAME)";SDKROOT=macosx;', 'PRODUCT_NAME="AirMate";SDKROOT=macosx;', 1)
          p.write_text(text)

          # 2) Info.plists: visible name/version/build.
          for plist in ['AirMate/Resources/Info.plist','AirMateMobile/Info.plist','AirMateWatch/Info.plist']:
              path = Path(plist)
              s = path.read_text()
              def set_key(src, key, value):
                  pat = rf'(<key>{re.escape(key)}</key>\s*<string>)(.*?)(</string>)'
                  if re.search(pat, src, flags=re.S):
                      return re.sub(pat, rf'\g<1>{value}\g<3>', src, flags=re.S)
                  return src
              s = set_key(s, 'CFBundleDisplayName', 'AirMate')
              s = set_key(s, 'CFBundleName', 'AirMate')
              s = set_key(s, 'CFBundleShortVersionString', '26.15')
              s = set_key(s, 'CFBundleVersion', '10')
              path.write_text(s)

          # 3) macOS icon set: every required size, generated from existing 1024 master.
          icon_dir = Path('AirMate/Assets.xcassets/AppIcon.appiconset')
          contents = {
            'images': [
              {'filename':'icon_16x16.png','idiom':'mac','scale':'1x','size':'16x16'},
              {'filename':'icon_16x16@2x.png','idiom':'mac','scale':'2x','size':'16x16'},
              {'filename':'icon_32x32.png','idiom':'mac','scale':'1x','size':'32x32'},
              {'filename':'icon_32x32@2x.png','idiom':'mac','scale':'2x','size':'32x32'},
              {'filename':'icon_128x128.png','idiom':'mac','scale':'1x','size':'128x128'},
              {'filename':'icon_128x128@2x.png','idiom':'mac','scale':'2x','size':'128x128'},
              {'filename':'icon_256x256.png','idiom':'mac','scale':'1x','size':'256x256'},
              {'filename':'icon_256x256@2x.png','idiom':'mac','scale':'2x','size':'256x256'},
              {'filename':'icon_512x512.png','idiom':'mac','scale':'1x','size':'512x512'},
              {'filename':'AirMateIcon.png','idiom':'mac','scale':'2x','size':'512x512'}
            ],
            'info': {'author':'xcode','version':1}
          }
          (icon_dir/'Contents.json').write_text(json.dumps(contents, indent=2) + '\n')

          # 4) CloudKit robustness and diagnostics on Mac.
          path = Path('AirMate/Models/DeviceStore.swift')
          s = path.read_text()
          s = s.replace('@Published private(set) var lastSync: Date?\n', '@Published private(set) var lastSync: Date?\n    @Published private(set) var accountFingerprint = "Checking…"\n    @Published private(set) var lastError: String?\n')
          s = s.replace('private let liveWindow: TimeInterval = 180', 'private let liveWindow: TimeInterval = 86_400')
          s = s.replace('func start() {\n        refresh()\n    }', '''func start() {
        NotificationCenter.default.addObserver(forName: .CKAccountChanged, object: nil, queue: .main) { [weak self] _ in
            Task { @MainActor in self?.refresh() }
        }
        refresh()
    }''')
          s = s.replace('statusText = "Syncing…"\n            let database = container.privateCloudDatabase', '''statusText = "Syncing…"
            lastError = nil
            let userRecordID = try await container.userRecordID()
            accountFingerprint = Self.shortAccountFingerprint(userRecordID.recordName)
            let database = container.privateCloudDatabase''')
          s = s.replace('statusText = "Cloud error: \\(error.localizedDescription)"', 'lastError = error.localizedDescription\n            statusText = "Cloud error: \\(error.localizedDescription)"')
          marker = '    private var peerHostCount: Int {'
          helper = '''    private static func shortAccountFingerprint(_ value: String) -> String {
        var hash: UInt64 = 1469598103934665603
        for byte in value.utf8 { hash = (hash ^ UInt64(byte)) &* 1099511628211 }
        return String(format: "%08X", UInt32(truncatingIfNeeded: hash))
    }

'''
          if helper.strip() not in s:
              s = s.replace(marker, helper + marker)
          path.write_text(s)

          # 5) Mac settings: show the actual iCloud account fingerprint and sync error.
          path = Path('AirMate/UI/SettingsView.swift')
          s = path.read_text()
          s = s.replace('LabeledContent("Status", value: store.cloudSync.statusText)', 'LabeledContent("Status", value: store.cloudSync.statusText)\n                LabeledContent("iCloud account", value: store.cloudSync.accountFingerprint)')
          s = s.replace('LabeledContent("Live cloud devices", value: "\\(store.cloudSync.peers.count)")', 'LabeledContent("Cloud devices", value: "\\(store.cloudSync.peers.count)")\n                if let error = store.cloudSync.lastError { Text(error).font(.caption).foregroundStyle(.red).textSelection(.enabled) }')
          s = s.replace('LabeledContent("Version", value: "0.9.0 beta")', 'LabeledContent("Version", value: "26.15 (10)")')
          path.write_text(s)

          # 6) iPhone/iPad CloudKit: longer snapshot retention, account fingerprint, account-change refresh,
          #    and foreground refresh so sync resumes immediately after backgrounding.
          path = Path('AirMateMobile/AirMateMobileApp.swift')
          s = path.read_text()
          s = s.replace('@Published private(set) var cloudStatusText = "Starting…"\n', '@Published private(set) var cloudStatusText = "Starting…"\n    @Published private(set) var cloudAccountFingerprint = "Checking…"\n    @Published private(set) var cloudLastError: String?\n')
          s = s.replace('private let cloudLiveWindow: TimeInterval = 180', 'private let cloudLiveWindow: TimeInterval = 86_400')
          s = s.replace('UIDevice.current.isBatteryMonitoringEnabled = true\n        refreshLocalState()', '''UIDevice.current.isBatteryMonitoringEnabled = true
        observers.append(NotificationCenter.default.addObserver(forName: .CKAccountChanged, object: nil, queue: .main) { [weak self] _ in
            Task { @MainActor in self?.refreshAll() }
        })
        refreshLocalState()''')
          s = s.replace('cloudStatusText = "Syncing…"\n            let database = cloudContainer.privateCloudDatabase', '''cloudStatusText = "Syncing…"
            cloudLastError = nil
            let userRecordID = try await cloudContainer.userRecordID()
            cloudAccountFingerprint = Self.shortAccountFingerprint(userRecordID.recordName)
            let database = cloudContainer.privateCloudDatabase''')
          s = s.replace('cloudStatusText = "Cloud error: \\(error.localizedDescription)"', 'cloudLastError = error.localizedDescription\n            cloudStatusText = "Cloud error: \\(error.localizedDescription)"')
          # Add helper before stableUUID if present, otherwise before @main.
          helper = '''    private static func shortAccountFingerprint(_ value: String) -> String {
        var hash: UInt64 = 1469598103934665603
        for byte in value.utf8 { hash = (hash ^ UInt64(byte)) &* 1099511628211 }
        return String(format: "%08X", UInt32(truncatingIfNeeded: hash))
    }

'''
          if 'shortAccountFingerprint' not in s:
              pos = s.find('    private func stableUUID')
              if pos < 0: pos = s.find('@main')
              s = s[:pos] + helper + s[pos:]
          # Settings diagnostics if labels exist.
          s = s.replace('LabeledContent("Cloud", value: reporter.cloudStatusText)', 'LabeledContent("Cloud", value: reporter.cloudStatusText)\n                LabeledContent("iCloud account", value: reporter.cloudAccountFingerprint)\n                if let error = reporter.cloudLastError { Text(error).font(.caption).foregroundStyle(.red).textSelection(.enabled) }')
          # Refresh when app becomes active.
          s = s.replace('@StateObject private var reporter = MobileReporter()\n', '@StateObject private var reporter = MobileReporter()\n    @Environment(\\.scenePhase) private var scenePhase\n')
          needle = '.preferredColorScheme(preferredScheme)'
          if needle in s and '.onChange(of: scenePhase)' not in s:
              s = s.replace(needle, needle + '''
            .onChange(of: scenePhase) { _, phase in
                if phase == .active { reporter.refreshAll() }
            }''', 1)
          path.write_text(s)

          # 7) Improve Mac Bluetooth battery collection using macOS system_profiler JSON.
          path = Path('AirMate/Services/BluetoothScanner.swift')
          s = path.read_text()
          s = s.replace('refreshClassicBluetoothDevices()\n        classicTimer?.invalidate()', 'refreshClassicBluetoothDevices()\n        refreshSystemBluetoothBatteryLevels()\n        classicTimer?.invalidate()')
          s = s.replace('Task { @MainActor in self?.refreshClassicBluetoothDevices() }', 'Task { @MainActor in self?.refreshClassicBluetoothDevices(); self?.refreshSystemBluetoothBatteryLevels() }')
          insert_before = '    private func stableBluetoothUUID(address: String, fallback: String) -> UUID {'
          battery_method = r'''    private func refreshSystemBluetoothBatteryLevels() {
        Task.detached(priority: .utility) { [weak self] in
            let process = Process()
            process.executableURL = URL(fileURLWithPath: "/usr/sbin/system_profiler")
            process.arguments = ["SPBluetoothDataType", "-json", "-detailLevel", "mini"]
            let pipe = Pipe()
            process.standardOutput = pipe
            process.standardError = Pipe()
            do {
                try process.run()
                let data = pipe.fileHandleForReading.readDataToEndOfFile()
                process.waitUntilExit()
                guard process.terminationStatus == 0,
                      let root = try JSONSerialization.jsonObject(with: data) as? [String: Any] else { return }
                var samples: [(name: String, address: String?, main: Int?, left: Int?, right: Int?, caseLevel: Int?)] = []
                func pct(_ value: Any?) -> Int? {
                    if let n = value as? NSNumber { return max(0, min(100, n.intValue)) }
                    guard let text = value as? String else { return nil }
                    let digits = text.filter(\.isNumber)
                    return Int(digits).map { max(0, min(100, $0)) }
                }
                func walk(_ value: Any, keyName: String? = nil) {
                    if let dict = value as? [String: Any] {
                        let batteryKeys = dict.keys.filter { $0.lowercased().contains("battery") }
                        if !batteryKeys.isEmpty, let name = keyName {
                            func first(_ tokens: [String]) -> Int? {
                                for (k,v) in dict {
                                    let l = k.lowercased()
                                    if tokens.allSatisfy({ l.contains($0) }), let p = pct(v) { return p }
                                }
                                return nil
                            }
                            let address = dict.first { $0.key.lowercased().contains("address") }?.value as? String
                            samples.append((name,address,first(["battery","main"] ) ?? first(["battery"]),first(["battery","left"]),first(["battery","right"]),first(["battery","case"])))
                        }
                        for (k,v) in dict { walk(v, keyName: k) }
                    } else if let array = value as? [Any] {
                        for v in array { walk(v, keyName: keyName) }
                    }
                }
                walk(root)
                await MainActor.run {
                    guard let self else { return }
                    for sample in samples {
                        guard let existing = self.discovered.first(where: { _, d in
                            d.name.caseInsensitiveCompare(sample.name) == .orderedSame ||
                            (sample.address != nil && d.metadata["address"]?.caseInsensitiveCompare(sample.address!) == .orderedSame)
                        }) else { continue }
                        var d = existing.value
                        if let main = sample.main { d.batteryLevel = main }
                        if let left = sample.left { d.batteryLevel = left }
                        if let right = sample.right { d.secondaryBatteryLevel = right }
                        if let c = sample.caseLevel { d.caseBatteryLevel = c }
                        d.metadata["batterySource"] = "system_profiler"
                        self.discovered[existing.key] = d
                    }
                }
            } catch { }
        }
    }

'''
          if 'refreshSystemBluetoothBatteryLevels' not in s[s.find(insert_before)-5000:s.find(insert_before)]:
              s = s.replace(insert_before, battery_method + insert_before)
          path.write_text(s)

          # 8) Update README version marker if present.
          path = Path('README.md')
          s = path.read_text()
          s = re.sub(r'0\.9\.0(?: beta)?', '26.15', s)
          path.write_text(s)
          PY

          # Generate all required macOS icon sizes from the existing 1024x1024 master.
          ICON_DIR="AirMate/Assets.xcassets/AppIcon.appiconset"
          MASTER="$ICON_DIR/AirMateIcon.png"
          sips -z 16 16 "$MASTER" --out "$ICON_DIR/icon_16x16.png" >/dev/null
          sips -z 32 32 "$MASTER" --out "$ICON_DIR/icon_16x16@2x.png" >/dev/null
          cp "$ICON_DIR/icon_16x16@2x.png" "$ICON_DIR/icon_32x32.png"
          sips -z 64 64 "$MASTER" --out "$ICON_DIR/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 "$MASTER" --out "$ICON_DIR/icon_128x128.png" >/dev/null
          sips -z 256 256 "$MASTER" --out "$ICON_DIR/icon_128x128@2x.png" >/dev/null
          cp "$ICON_DIR/icon_128x128@2x.png" "$ICON_DIR/icon_256x256.png"
          sips -z 512 512 "$MASTER" --out "$ICON_DIR/icon_256x256@2x.png" >/dev/null
          cp "$ICON_DIR/icon_256x256@2x.png" "$ICON_DIR/icon_512x512.png"

      - name: Validate files and builds
        shell: bash
        run: |
          set -euo pipefail
          find AirMate AirMateWidget AirMateMobile AirMateMobileWidget AirMateWatch \( -name '*.plist' -o -name '*.entitlements' \) -print0 | xargs -0 -n1 plutil -lint
          xcodebuild -project AirMate.xcodeproj -scheme AirMate -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project AirMate.xcodeproj -scheme AirMateMobile -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project AirMate.xcodeproj -scheme AirMateWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build

      - name: Commit repairs to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AirMate Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/repair-icloud-icon-battery.yml
          git commit -m "Fix iCloud sync icons and Mac battery reporting"
          git push origin HEAD:main
