name: Build AirMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mac:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Mac + Widget
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -target AirMate -configuration Debug CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac-build.log
      - name: Upload Mac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: mac-build.log

  mobile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Show mobile widget build settings
        shell: bash
        run: |
          xcodebuild -project AirMate.xcodeproj -target AirMateMobileWidget -configuration Debug -sdk iphonesimulator -showBuildSettings | grep -E '(^| )((INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|SDKROOT|SUPPORTED_PLATFORMS|PRODUCT_TYPE|WRAPPER_EXTENSION) = )' || true
      - name: Build iPhone/iPad companion
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -target AirMateMobile -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mobile-build.log
      - name: Upload Mobile build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-log
          path: mobile-build.log

  watch:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Show watch build settings
        shell: bash
        run: |
          xcodebuild -project AirMate.xcodeproj -target AirMateWatch -configuration Debug -sdk watchsimulator -showBuildSettings | grep -E '(^| )((INFOPLIST_FILE|GENERATE_INFOPLIST_FILE|PRODUCT_BUNDLE_IDENTIFIER|WATCHOS_DEPLOYMENT_TARGET|SDKROOT|SUPPORTED_PLATFORMS|PRODUCT_TYPE|WRAPPER_EXTENSION) = )' || true
      - name: Build Watch companion
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -target AirMateWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee watch-build.log
      - name: Upload Watch build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-build-log
          path: watch-build.log
