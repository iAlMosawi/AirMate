name: Build AirMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build AirMate
        run: |
          xcodebuild \
            -project AirMate.xcodeproj \
            -target AirMate \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
