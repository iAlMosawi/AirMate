name: Build AirMate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  project-validation:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Verify single project and shared schemes
        shell: bash
        run: |
          set -euo pipefail
          test -d AirMate.xcodeproj
          test "$(find . -maxdepth 1 -name '*.xcodeproj' -type d | wc -l | tr -d ' ')" = "1"
          xcodebuild -project AirMate.xcodeproj -list
      - name: Validate plist and entitlement files
        shell: bash
        run: |
          set -euo pipefail
          find AirMate AirMateWidget AirMateMobile AirMateMobileWidget AirMateWatch \
            \( -name '*.plist' -o -name '*.entitlements' \) -print0 | \
            xargs -0 -n1 plutil -lint
      - name: Verify embedded target signing configuration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          text = Path('AirMate.xcodeproj/project.pbxproj').read_text()

          required_debug_configs = {
              'Mac app': '900000000000000000000003',
              'Mac widget': '900000000000000000000005',
              'iPhone/iPad app': 'A90000000000000000000003',
              'iPhone/iPad widget': 'C90000000000000000000003',
              'Watch app': 'B90000000000000000000003',
          }

          for label, config_id in required_debug_configs.items():
              marker = f'{config_id}={{isa=XCBuildConfiguration;buildSettings={{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'Missing Debug configuration for {label}')
              end = text.find('};name=Debug;};', start)
              if end < 0:
                  raise SystemExit(f'Malformed Debug configuration for {label}')
              config = text[start:end]
              if 'CODE_SIGN_STYLE=Automatic;' not in config:
                  raise SystemExit(f'{label} is not using Automatic signing')
              if 'CODE_SIGN_IDENTITY="Apple Development";' not in config:
                  raise SystemExit(f'{label} does not use Apple Development for Debug')

          required_embed_relations = [
              ('AirMate', 'AirMateWidget.appex'),
              ('AirMateMobile', 'AirMateMobileWidget.appex'),
          ]
          for parent, child in required_embed_relations:
              if child not in text:
                  raise SystemExit(f'{parent} is missing embedded product {child}')

          print('Signing and embedded-target configuration is consistent.')
          PY

  mac:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Mac + Widget
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -scheme AirMate -configuration Debug -sdk macosx CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mac-build.log
      - name: Upload Mac build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-build-log
          path: mac-build.log

  mobile:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build iPhone/iPad companion + Widget
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -scheme AirMateMobile -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee mobile-build.log
      - name: Upload Mobile build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-build-log
          path: mobile-build.log

  watch:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build Watch companion
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project AirMate.xcodeproj -scheme AirMateWatch -configuration Debug -sdk watchsimulator CODE_SIGNING_ALLOWED=NO build 2>&1 | tee watch-build.log
      - name: Upload Watch build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-build-log
          path: watch-build.log
